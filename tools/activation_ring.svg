<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="79%" stop-color="white" stop-opacity="0"/>
      <stop offset="88%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="94%" stop-color="white" stop-opacity="1"/>
      <stop offset="97%" stop-color="white" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="246" fill="url(#rim)" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="229" fill="none" stroke="white" stroke-opacity="0.8" stroke-width="3"/>
</svg>
