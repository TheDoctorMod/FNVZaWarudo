[General]
; DirectInput scan code. 35 is H. Restart the game after changing this value.
iHotkey=35
[Safety]
; Loading screens and death are lifecycle boundaries where frozen pointers cannot survive.
bCancelBeforeLoadDoors=1
bCancelOnDeath=1

[Perception]
; Prevent the detection system from learning the player's frozen-time position.
bSuppressPlayerDetection=1
; Real seconds of perfect concealment after H resumes time. NPCs search the old position.
; This does not force crouching or change movement speed.
fPostResumeHiddenSeconds=1.75

[Visuals]
bEnableVisuals=1
bEnableActivationFlash=0
bEnableResumeFlash=0
; Expanding centre-screen shockwave when the world freezes, before the
; inverted palette appears. Requires UIO - User Interface Organizer.
bEnableActivationRing=1
fActivationRingSeconds=0.48
; HUD opacity uses Fallout's 0-255 scale.
fActivationRingAlpha=235.0
; Static The World palette only. Blur and flashes are disabled.
fSaturationMultiplier=-1.0
fContrastMultiplier=1.0
fBlurRadius=0.0
fDoubleVision=0.0
fRadialBlur=0.0

[Audio]
bEnableAudio=1
; 0 uses clearly identified vanilla VATS placeholder sounds.
; 1 uses the custom paths below through JohnnyGuitar NVSE.
bUseCustomAudio=1
; JohnnyGuitar 5.17+ paths, relative to the New Vegas folder.
sActivationPath=Data\Sound\fx\TheWorldNV\active.wav
sResumePath=Data\Sound\fx\TheWorldNV\resume.wav
; Fallout Sound form paths, relative to Data\Sound (JohnnyGuitar 5.16 and older).
sActivationSoundFile=fx\TheWorldNV\active.wav
sResumeSoundFile=fx\TheWorldNV\resume.wav
; Pause background music and mute voice/radio buses during the exact freeze.
; The engine has no script API that pauses voice/radio streams in place.
bFreezeWorldAudio=1
